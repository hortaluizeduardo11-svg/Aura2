<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Genesis</title>
<meta name="description" content="A 2D pixel-art god sandbox: layered terrain, living fluids, kingdoms with genetics, faiths, trade and war.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;1,400&family=Alegreya+Sans:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
  /* Layout: the world canvas is full-bleed; floating "tablets" hold the god tools (left),
     the chronicle / inspector (right) and the calendar HUD (top). One deliberate night palette. */
  :root {
    --bg: #0d121c;
    --panel: rgba(16, 22, 35, 0.9);
    --panel-solid: #131a29;
    --raise: rgba(255, 244, 214, 0.06);
    --line: rgba(222, 202, 150, 0.15);
    --ink: #ede5d1;
    --muted: #a59c87;
    --gold: #e8b64c;
    --gold-ink: #1e1504;
    --war: #e5584f;
    --peace: #7cc48a;
    --faith: #b58be0;
    --display: "Pixelify Sans", "Courier New", ui-monospace, monospace;
    --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
    --lore: "Alegreya", Georgia, "Times New Roman", serif;
    --r: 7px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #app { position: relative; height: 100%; overflow: hidden; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; background: #0e2a5a; }
  .glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
    background: linear-gradient(rgba(13, 18, 28, 0.92), rgba(13, 18, 28, 0)); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font: 700 22px/1 var(--display); letter-spacing: 0.06em; color: var(--gold); text-shadow: 0 2px 0 #4a3510; }
  .brand span { font: 500 14px/1 var(--display); letter-spacing: 0.08em; color: var(--ink); opacity: 0.8; }
  #clock { font: 500 14px/1.2 var(--body); padding: 5px 10px; white-space: nowrap; }
  #clock .sun { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  #stats { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #stats b { color: var(--ink); font-weight: 600; }
  .grow { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
  .seg button { background: none; border: 0; padding: 6px 10px; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--gold); color: var(--gold-ink); }
  .hudbtn { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; font-size: 13px; font-weight: 500; }
  .hudbtn.on { border-color: var(--gold); color: var(--gold); }
  select.hudbtn { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(-45deg, transparent 50%, var(--muted) 50%); background-position: right 11px center, right 6px center; background-size: 5px 5px; background-repeat: no-repeat; }
  select.hudbtn option { background: var(--panel-solid); }

  /* ---------- tools ---------- */
  #tools { position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); top: 64px; bottom: 12px; width: 238px; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow: hidden; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .cat { background: none; border: 1px solid transparent; border-radius: 5px; padding: 5px 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .cat.on { color: var(--ink); background: var(--raise); border-color: var(--line); }
  #toolgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; overflow-y: auto; min-height: 0; flex: 0 1 auto; }
  .tool { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 5px; background: none; border: 1px solid transparent; font-size: 14px; font-weight: 500; text-align: left; min-width: 0; }
  .tool span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool:hover { background: var(--raise); }
  .tool.on { border-color: var(--gold); background: rgba(232, 182, 76, 0.12); }
  .sw { width: 12px; height: 12px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  #brush { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
  #toolname { font: 700 15px/1.1 var(--display); letter-spacing: 0.03em; color: var(--gold); }
  #tooldesc { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .slider { display: grid; grid-template-columns: 62px 1fr 28px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .slider input { width: 100%; accent-color: var(--gold); }
  .slider output { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  #diseaserow { display: flex; gap: 6px; }
  #diseaserow select { flex: 1; min-width: 0; }
  #minimapwrap { margin-top: auto; display: grid; gap: 6px; }
  #minimap { width: 100%; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 4px; border: 1px solid var(--line); image-rendering: pixelated; cursor: pointer; background: #0e2a5a; }
  #hoverinfo { font-size: 12px; color: var(--muted); min-height: 32px; line-height: 1.35; font-variant-numeric: tabular-nums; }

  /* ---------- panel ---------- */
  #panel { position: absolute; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); top: 64px; bottom: 12px; width: 352px; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; background: none; border: 0; padding: 10px 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--ink); border-bottom-color: var(--gold); }
  .pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; }
  .pbody h2 { font: 700 18px/1.15 var(--display); letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
  .pbody h3 { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .pbody p { margin: 4px 0; }
  .empty { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .ihead { display: flex; gap: 10px; align-items: center; }
  .ihead img, .banner { width: 20px; height: 28px; image-rendering: pixelated; flex: none; border-radius: 2px; }
  .chipdot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
  .rows { display: grid; gap: 5px; }
  .row { display: grid; grid-template-columns: 92px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; }
  .row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--raise); }
  .chip.good { border-color: rgba(124, 196, 138, 0.5); color: #b9e6c1; }
  .chip.bad { border-color: rgba(229, 88, 79, 0.5); color: #f3b2ac; }
  .chip.holy { border-color: rgba(232, 182, 76, 0.6); color: #f6d891; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .btn { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; font-size: 13px; font-weight: 500; }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
  a.link, button.link { color: var(--ink); text-decoration: underline; text-decoration-color: rgba(232, 182, 76, 0.5); text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; }
  .dead { color: var(--muted); }
  .tree { display: grid; gap: 6px; font-size: 13px; }
  .tree .gen { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tree .lbl { width: 76px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; flex: none; }
  .tree .p { padding: 2px 7px; border-radius: 4px; background: var(--raise); border: 1px solid var(--line); }
  .tree .self { border-color: var(--gold); }
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font: italic 400 14px/1.35 var(--lore); }
  .log li span { font: 600 11px var(--body); color: var(--muted); font-style: normal; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .realm { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .realm:hover { background: var(--raise); border-color: var(--line); }
  .realm .nm { font-weight: 700; }
  .realm .meta { font-size: 12px; color: var(--muted); }
  .pips { display: grid; grid-template-columns: repeat(4, auto); gap: 3px 8px; font-size: 11px; color: var(--muted); }
  .pip { display: inline-flex; gap: 2px; }
  .pip i { width: 6px; height: 6px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); }
  .ctree { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .ctree .col { display: grid; gap: 4px; align-content: start; }
  .ctree .head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .node { font-size: 11.5px; line-height: 1.2; padding: 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .node.got { color: var(--ink); background: var(--raise); }
  .node.next { border-style: dashed; }
  .chron { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .chron li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 6px 4px; border-radius: 5px; font: 400 14.5px/1.35 var(--lore); cursor: default; }
  .chron li[data-x] { cursor: pointer; }
  .chron li[data-x]:hover { background: var(--raise); }
  .chron .yr { font: 600 11px/1.9 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
  .chron .k-war { color: #f3b2ac; } .chron .k-peace { color: #b9e6c1; } .chron .k-faith { color: #d9c2f1; }
  .chron .k-disaster { color: #ffc49b; } .chron .k-plague { color: #cfe5a6; } .chron .k-culture { color: #f6d891; } .chron .k-fall { color: #c7c0b0; }
  .rel { display: grid; grid-template-columns: 1fr 64px 56px; gap: 8px; align-items: center; font-size: 13px; }
  .opbar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; position: relative; overflow: hidden; }
  .opbar i { position: absolute; top: 0; bottom: 0; }
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; text-align: right; }
  .tag.war { color: var(--war); } .tag.peace { color: var(--peace); }
  .deity { font: italic 400 14px/1.35 var(--lore); }
  .deity b { font-style: normal; font-weight: 500; }

  /* ---------- overlays ---------- */
  #toast { position: absolute; z-index: 9; top: 70px; left: 50%; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); padding: 9px 14px; font-size: 14px; text-align: center; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #avatarpad { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: 18px; display: flex; gap: 6px; padding: 8px; align-items: center; }
  #avatarpad .who { font-size: 13px; padding: 0 6px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #avatarpad kbd { font: 600 11px var(--body); color: var(--muted); margin-left: 4px; }
  #modal { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(5, 8, 14, 0.6); padding: 16px; }
  #modal .box { width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 18px 20px 20px; background: var(--panel-solid); }
  #modal h2 { font: 700 20px/1.15 var(--display); margin: 0 0 4px; }
  #modal .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 14px 0; }
  #modal label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  #modal input[type=text], #modal input[type=number] { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  #modal input[type=range] { accent-color: var(--gold); width: 100%; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
  .checks label { display: flex !important; align-items: center; gap: 6px; color: var(--ink) !important; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 12px 0; }
  .keys kbd { font: 600 12px var(--body); padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); background: var(--raise); white-space: nowrap; justify-self: start; }

  /* ---------- phones ---------- */
  @media (max-width: 760px) {
    #hud { gap: 6px 8px; padding-bottom: 6px; }
    .brand b { font-size: 18px; } .brand span { display: none; }
    #stats, .grow { display: none; }
    #clock { font-size: 12px; padding: 4px 8px; }
    .seg button, .hudbtn { padding: 5px 8px; font-size: 12px; }
    #tools { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 44%; border-radius: 12px 12px 0 0; padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); gap: 6px; }
    #cats { display: flex; overflow-x: auto; scrollbar-width: none; }
    .cat { flex: none; padding: 5px 9px; }
    #toolgrid { display: flex; overflow-x: auto; scrollbar-width: none; flex: none; }
    .tool { flex: none; padding: 7px 10px; }
    #brush { padding-top: 6px; gap: 5px; }
    #tooldesc, #minimapwrap { display: none; }
    #toolname { font-size: 13px; }
    #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 186px; height: 50%; }
    #avatarpad { bottom: 196px; }
    #toast { top: 96px; }
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="The world. Drag to use the selected tool, scroll or pinch to zoom."></canvas>

  <header id="hud">
    <div class="brand"><b>AURA</b><span>GENESIS</span></div>
    <div id="clock" class="glass num" aria-live="off">Year 1 · Spring</div>
    <div id="stats" class="num"></div>
    <div class="grow"></div>
    <div class="seg" id="speed" role="group" aria-label="Simulation speed">
      <button type="button" data-speed="0" title="Pause (Space)" aria-label="Pause"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="1" width="3" height="10" fill="currentColor"/><rect x="6" y="1" width="3" height="10" fill="currentColor"/></svg></button>
      <button type="button" data-speed="1" class="on">1×</button>
      <button type="button" data-speed="2">2×</button>
      <button type="button" data-speed="4">4×</button>
      <button type="button" data-speed="8">8×</button>
    </div>
    <div class="seg" id="layers" role="group" aria-label="World layer">
      <button type="button" data-view="0" title="Underground layer (Tab)">Deep</button>
      <button type="button" data-view="1" class="on">Surface</button>
      <button type="button" data-view="2" title="Sky layer: full clouds and storms">Sky</button>
    </div>
    <select id="overlay" class="hudbtn" aria-label="Map overlay">
      <option value="realms">Realms</option>
      <option value="faith">Faiths</option>
      <option value="heat">Climate</option>
      <option value="none">No overlay</option>
    </select>
    <button type="button" id="btn-trade" class="hudbtn on" aria-pressed="true">Trade</button>
    <button type="button" id="btn-panel" class="hudbtn on" aria-pressed="true">Chronicle</button>
    <button type="button" id="btn-help" class="hudbtn" aria-label="Help and controls">?</button>
  </header>

  <nav id="tools" class="glass" aria-label="God tools">
    <div id="cats" role="tablist"></div>
    <div id="toolgrid"></div>
    <div id="brush">
      <div id="toolname">Inspect</div>
      <div id="tooldesc"></div>
      <label class="slider" id="sizerow"><span>Brush</span><input id="bsize" type="range" min="1" max="20" step="1" value="5"><output id="bsizev">5</output></label>
      <label class="slider" id="strrow"><span>Strength</span><input id="bstr" type="range" min="0.1" max="1" step="0.05" value="0.6"><output id="bstrv">60</output></label>
      <div id="diseaserow" hidden><select id="disease" class="hudbtn" aria-label="Disease to spread"></select><button type="button" class="btn" id="btn-editdisease" title="Design a new disease">New…</button></div>
    </div>
    <div id="minimapwrap">
      <canvas id="minimap" width="192" height="128" aria-label="Minimap: click to move the camera"></canvas>
      <div id="hoverinfo"></div>
    </div>
  </nav>

  <aside id="panel" class="glass" aria-label="Chronicle and inspector">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" data-tab="inspect">Inspect</button>
      <button type="button" class="tab" data-tab="realms">Realms</button>
      <button type="button" class="tab on" data-tab="chronicle">Chronicle</button>
      <button type="button" class="tab" data-tab="world">World</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>

  <div id="avatarpad" class="glass" hidden>
    <span class="who" id="avatarwho"></span>
    <button type="button" class="btn" id="pad-strike">Strike<kbd>Space</kbd></button>
    <button type="button" class="btn" id="pad-power">Power<kbd>E</kbd></button>
    <button type="button" class="btn primary" id="pad-release">Release<kbd>Esc</kbd></button>
  </div>

  <div id="toast" class="glass" role="status" aria-live="polite"></div>
  <div id="modal" hidden><div class="box glass" id="modalbox" role="dialog" aria-modal="true"></div></div>
</div>

<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/sky.js"></script>
<script src="js/fx.js"></script>
<script src="js/physics.js"></script>
<script src="js/entities.js"></script>
<script src="js/civ.js"></script>
<script src="js/ai.js"></script>
<script src="js/god.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
